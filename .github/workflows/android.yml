name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LSPosed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Run grid integrity tests and build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify LSPosed metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          for entry in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
            unzip -Z1 "$apk" | grep -Fxq "$entry"
          done
          test "$(unzip -p "$apk" META-INF/xposed/java_init.list | tr -d '\r\n')" = "com.yu4032.olaunchermod.LauncherModule"
          unzip -p "$apk" META-INF/xposed/scope.list | grep -Fxq "com.android.launcher"
          unzip -p "$apk" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"
          mkdir -p dist
          cp "$apk" dist/OLauncherMod-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OLauncherMod-debug-${{ github.run_number }}
          path: dist/OLauncherMod-debug.apk
          if-no-files-found: error
          retention-days: 30
