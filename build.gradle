plugins {
    id 'com.android.application' version '8.11.1'
    id 'org.jetbrains.kotlin.android' version '2.2.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
}

android {
    namespace 'com.yu4032.olaunchermod'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yu4032.olaunchermod'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    // Preserve the existing compact repository layout.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src/main/kotlin']
            res.srcDirs = ['res']
            resources.srcDirs = ['src/main/resources']
        }
        test {
            java.srcDirs = ['tests']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Provided by the LSPosed framework at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'

    // Keep AGP 8.11.1 / compileSdk 36: the currently published COUI 1.1.0
    // depends on newer Kotlin/Compose than this hook module. Compose +
    // Material3 with ColorOS-style card/slider surfaces is a compatible base.
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
