plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.yu4032.olaunchermod'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yu4032.olaunchermod'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    // Preserve the existing compact repository layout.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            resources.srcDirs = ['src/main/resources']
        }
        test {
            java.srcDirs = ['tests']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Provided by the LSPosed framework at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
